<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MolB World — 몰비의 서재와 섬</title>
    <meta
      name="description"
      content="서재에서 읽던 책을 펼치고, 몰비의 섬에서 배운 말을 써 보세요. 홈페이지에서는 영어 지문 세 편과 블랭크북 빈칸 공부를 체험할 수 있어요."
    />
    <meta name="theme-color" content="#FBF6ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17130F" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MolB World — 몰비의 서재와 섬" />
    <meta property="og:description" content="몰비의 서재와 섬을 둘러보고, 영어 지문과 블랭크북을 직접 체험해 보세요." />
    <meta property="og:image" content="./img/og.jpg" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- 홈 화면에 두면 앱처럼(주소창 없이) 열린다 — 아이콘 · 이름은 매니페스트, iOS는 아래 meta도 본다 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MolB World" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="preload" href="./fonts/Literata-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <script>
      // 고른 테마가 있으면 첫 그림 전에 세운다 — 깜빡이지 않게. 고른 적이 없으면 CSS가 기기 설정을 따른다.
      (function () {
        var t = null;
        try {
          t = JSON.parse(localStorage.getItem('molbworld.theme'));
        } catch (e) {}
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        MolB World는 자바스크립트로 움직여요. 찍먹 · 블랭크북을 쓰려면 자바스크립트를 켜 주세요.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
